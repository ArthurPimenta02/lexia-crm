name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execucoes antigas do mesmo branch/PR quando um novo push chega.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Cache do build Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # O build nao le segredos: todas as variaveis de ambiente do Supabase sao
      # lidas dentro das funcoes (lib/supabase/*.ts), nunca no topo do modulo.
      # Se algum dia isso mudar, este passo passa a exigir secrets no GitHub.
      - name: Build
        run: npm run build

  audit:
    name: Auditoria de dependencias (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nao bloqueia o merge: serve para dar visibilidade de CVEs novos.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
